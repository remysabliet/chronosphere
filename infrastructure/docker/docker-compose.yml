# =============================================================================
# Docker Compose for Memosphere Local Development
# Single file for local development only
# =============================================================================

# Shared by every service that talks to Postgres/Redis inside the compose network —
# merge with `<<: *db-env` instead of repeating these two lines per service.
x-db-env: &db-env
  DATABASE_URL: postgresql://memosphere:${POSTGRES_PASSWORD:-memosphere_secure_dev_2025!}@postgres:5432/memosphere_${ENVIRONMENT:-development}
  REDIS_URL: redis://redis:6379

services:
  # =============================================================================
  # Database Services
  # =============================================================================

  postgres:
    # pgvector/pgvector:*-pg17 is a drop-in for postgres:17 with the pgvector
    # extension pre-compiled in (see docs/architecture/question-diversity-and-dedup.md) —
    # same Postgres 17, same data directory layout, just `CREATE EXTENSION vector;` away.
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    container_name: memosphere-postgres-${ENVIRONMENT:-development}
    environment:
      POSTGRES_DB: memosphere_${ENVIRONMENT:-development}
      POSTGRES_USER: memosphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memosphere_secure_dev_2025!}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_${ENVIRONMENT:-development}_data:/var/lib/postgresql/data
    networks:
      - memosphere-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U memosphere -d memosphere_${ENVIRONMENT:-development}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  migration-service:
    build:
      context: ../../
      dockerfile: packages/migration-service/Dockerfile
    container_name: memosphere-migration-service-${ENVIRONMENT:-development}
    environment:
      <<: *db-env
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - memosphere-network
    command: pnpm run migrate:latest
    restart: 'no'

  redis:
    image: redis:7-alpine
    container_name: memosphere-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - memosphere-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Node.js Microservices
  # =============================================================================

  user-management-service:
    build:
      context: ../../
      dockerfile: packages/user-management-service/Dockerfile
      target: base
    container_name: memosphere-user-management
    env_file:
      - ../../packages/user-management-service/.env
    environment:
      <<: *db-env
    ports:
      - '3001:3001'
    volumes:
      # Mount source code for development
      - ../../packages/user-management-service/src:/app/packages/user-management-service/src
      # Preserve node_modules and package.json
      - /app/packages/user-management-service/node_modules
      - /app/node_modules
    command: pnpm --filter @memosphere/user-management-service dev
    depends_on:
      postgres:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - memosphere-network
    restart: unless-stopped

  content-management-service:
    build:
      context: ../../
      dockerfile: packages/content-management-service/Dockerfile
      target: base
    container_name: memosphere-content-management
    env_file:
      - ../../packages/content-management-service/.env
    environment:
      <<: *db-env
    ports:
      - '3002:3002'
    volumes:
      # Mount source code for development
      - ../../packages/content-management-service/src:/app/packages/content-management-service/src
      # Preserve node_modules and package.json
      - /app/packages/content-management-service/node_modules
      - /app/node_modules
    command: pnpm --filter @memosphere/content-management-service dev
    depends_on:
      postgres:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - memosphere-network
    restart: unless-stopped

  quiz-session-service:
    build:
      context: ../../
      dockerfile: packages/quiz-session-service/Dockerfile
      target: base
    container_name: memosphere-quiz-session
    env_file:
      - ../../packages/quiz-session-service/.env
    environment:
      <<: *db-env
      USER_MANAGEMENT_URL: http://user-management-service:3001
      LEARNING_ENGINE_URL: http://learning-engine-service:8002
      QUESTION_GENERATION_URL: http://question-generation-service:8001
    ports:
      - '3003:3003'
    volumes:
      # Mount entire package for development (your original approach)
      - ../../packages/quiz-session-service:/app/packages/quiz-session-service
    command: pnpm --filter @memosphere/quiz-session-service dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-management-service:
        condition: service_started
      learning-engine-service:
        condition: service_started
      question-generation-service:
        condition: service_started
      migration-service:
        condition: service_completed_successfully
    networks:
      - memosphere-network
    restart: unless-stopped

  analytics-service:
    build:
      context: ../../
      dockerfile: packages/analytics-service/Dockerfile
      target: base
    container_name: memosphere-analytics
    env_file:
      - ../../packages/analytics-service/.env
    environment:
      <<: *db-env
    ports:
      - '3004:3004'
    volumes:
      # Mount source code for development
      - ../../packages/analytics-service/src:/app/packages/analytics-service/src
      # Preserve node_modules and package.json
      - /app/packages/analytics-service/node_modules
      - /app/node_modules
    command: pnpm --filter @memosphere/analytics-service dev
    depends_on:
      postgres:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - memosphere-network
    restart: unless-stopped

  notification-service:
    build:
      context: ../../
      dockerfile: packages/notification-service/Dockerfile
      target: base
    container_name: memosphere-notification
    env_file:
      - ../../packages/notification-service/.env
    environment:
      <<: *db-env
    ports:
      - '3005:3005'
    volumes:
      # Mount source code for development
      - ../../packages/notification-service/src:/app/packages/notification-service/src
      # Preserve node_modules and package.json
      - /app/packages/notification-service/node_modules
      - /app/node_modules
    command: pnpm --filter @memosphere/notification-service dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
    networks:
      - memosphere-network
    restart: unless-stopped

  # =============================================================================
  # Python Microservices
  # =============================================================================

  question-generation-service:
    build:
      context: ../../
      dockerfile: packages/question-generation-service/Dockerfile
    container_name: memosphere-question-generation
    env_file:
      - ../../packages/question-generation-service/src/question_generation_service/.env
    environment:
      <<: *db-env
      ENABLE_BACKGROUND_WORKERS: 'true'
    ports:
      - '8001:8001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
    networks:
      - memosphere-network
    restart: unless-stopped
    volumes:
      - ../../packages/question-generation-service/src:/app/packages/question-generation-service/src
    command: uvicorn question_generation_service.main:app --host 0.0.0.0 --port 8001 --reload

  learning-engine-service:
    build:
      context: ../../
      dockerfile: packages/learning-engine-service/Dockerfile
    container_name: memosphere-learning-engine
    env_file:
      - ../../packages/learning-engine-service/src/learning_engine_service/.env
    environment:
      <<: *db-env
    ports:
      - '8002:8002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-service:
        condition: service_completed_successfully
    networks:
      - memosphere-network
    restart: unless-stopped
    volumes:
      - ../../packages/learning-engine-service/src:/app/packages/learning-engine-service/src
    command: uvicorn learning_engine_service.main:app --host 0.0.0.0 --port 8002 --reload

  # =============================================================================
  # Frontend
  # =============================================================================

  web-app:
    build:
      context: ../../
      dockerfile: apps/web-app/Dockerfile
      target: base
    container_name: memosphere-web-app
    env_file:
      - ../../apps/web-app/.env.local
    environment:
      NEXT_PUBLIC_QUESTION_GEN_URL: http://question-generation-service:8001
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ../../apps/web-app/src:/app/apps/web-app/src
      - ../../apps/web-app/public:/app/apps/web-app/public
      - ../../apps/web-app/next.config.js:/app/apps/web-app/next.config.js
      - /app/apps/web-app/node_modules
      - /app/node_modules
    command: pnpm --filter @memosphere/web-app dev
    depends_on:
      migration-service:
        condition: service_completed_successfully
      user-management-service:
        condition: service_started
    networks:
      - memosphere-network
    restart: unless-stopped

  # =============================================================================
  # API Gateway
  # =============================================================================

  nginx:
    image: nginx:alpine
    container_name: memosphere-nginx
    ports:
      - '80:80'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      migration-service: # ✅ Only needs migrations to complete
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - memosphere-network
    restart: unless-stopped

# =============================================================================
# Networks and Volumes
# =============================================================================

networks:
  memosphere-network:
    driver: bridge
    name: memosphere-network

volumes:
  # Database data - Docker volumes (recommended)
  postgres_development_data:
  postgres_test_data:
  redis_data:
