[tool.poetry]
name = "question-generation-service"
version = "1.0.0"
description = "AI-powered question generation service using Mistral Large API"
authors = ["Rémy SABLIET <sabliet@gmail.com>"]
license = "ISC"
packages = [{include = "question_generation_service", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
httpx = "^0.25.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.0"
redis = "^5.0.0"
python-dotenv = "^1.0.0"
mistralai = "^0.0.12"
openai = "^1.3.0"
numpy = "^1.24.0"
scikit-learn = "^1.3.0"
pandas = "^2.0.0"
scalar-fastapi = "^1.8.0"
sqlmodel = "^0.0.38"
annotated = "^0.0.2"
pydantic-settings = "^2.13.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.7.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "packages.question_generation_service.main:main"

# Import shared tool configuration
[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.toolchain]
shared_config = "../../tools/configs/pyproject.toml"