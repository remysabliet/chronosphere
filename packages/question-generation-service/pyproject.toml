[project]
name = "question-generation-service"
version = "1.0.0"
description = "AI-powered question generation service using Mistral Large API"
authors = [
    {name = "Rémy SABLIET", email = "sabliet@gmail.com"}
]
license = {text = "ISC"}
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "mistralai>=0.0.12",
    "openai>=1.3.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "scalar-fastapi>=1.8.0",
    "sqlmodel>=0.0.38",
    "annotated>=0.0.2",
    "pydantic-settings>=2.13.1",
    "greenlet>=3.4.0",
    "tenacity>=9.0.0",
    "memosphere-shared-auth",
]

[tool.uv.sources]
memosphere-shared-auth = { path = "../shared-python" }

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "testcontainers[postgres]>=4.9.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/question_generation_service"]

# Import shared tool configuration
[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.toolchain]
shared_config = "../../tools/configs/pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["question_generation_service"]
omit = ["tests/*", "*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING",
]
fail_under = 80
