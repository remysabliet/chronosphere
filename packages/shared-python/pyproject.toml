[project]
name = "memosphere-shared-auth"
version = "1.0.0"
description = "Shared Cognito JWT verification for Memosphere Python services"
authors = [
    {name = "Rémy SABLIET", email = "sabliet@gmail.com"}
]
license = {text = "ISC"}
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memosphere_auth"]
