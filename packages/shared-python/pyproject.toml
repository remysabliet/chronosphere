[project]
name = "memosphere-shared-auth"
version = "1.0.0"
description = "Shared Cognito JWT verification for Memosphere Python services"
authors = [
    {name = "Rémy SABLIET", email = "sabliet@gmail.com"}
]
license = {text = "ISC"}
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memosphere_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["memosphere_auth"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING",
]
fail_under = 80
